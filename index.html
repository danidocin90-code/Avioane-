<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Avioane 0.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe5;color:#24211d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}
h1{text-align:center;margin:3px 0;font-size:30px}
.sub{text-align:center;color:#70695d;margin-bottom:12px}
.panel{background:#fffdf8;border:1px solid #d5cdbc;border-radius:18px;padding:14px;box-shadow:0 5px 20px #00000012}
.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
button{font-size:15px;font-weight:800;border:1px solid #aaa18f;background:#fff;border-radius:11px;padding:10px 15px}
.status{text-align:center;font-weight:800;min-height:44px;display:flex;align-items:center;justify-content:center}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.title{text-align:center;font-weight:800;margin:4px 0 7px}
.grid{display:grid;grid-template-columns:23px repeat(10,1fr);grid-template-rows:23px repeat(10,1fr);aspect-ratio:1}
.coord{display:flex;align-items:center;justify-content:center;font-size:11px;color:#777}
.cell{border:1px solid #c8c0b0;background:#faf7ef;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;user-select:none}
.enemy .cell:hover{background:#eee7d9}
.cell.plane{background:#c9bea5}
.cell.miss{background:#dce5e7}
.cell.hit{background:#f0a06f!important}
.cell.cap{background:#45b85c!important;color:#102b0f;box-shadow:inset 0 0 0 3px #1f7a35}
.cell.destroyed{background:#a83d3d!important;color:white}
.cell.destroyed.cap{background:#66b85f!important;color:#102b0f}
.info{text-align:center;color:#746d61;font-size:12px;margin-top:12px}
@media(max-width:600px){.boards{grid-template-columns:1fr}.wrap{padding:9px}}
</style>

<style>
.theme-picker{display:flex;justify-content:center;margin:0 0 10px}
.theme-picker label{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}
.theme-picker select{border:1px solid #aaa18f;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700}
body.theme-military{background:#dfe2d4}
body.theme-military .panel{background:#f6f7ee;border-color:#9ba18b}
body.theme-military .cell{background:#e8eadf;border-color:#aab09d}
body.theme-military .cell.plane{background:#8f9a78}
body.theme-ocean{background:#dceff5;color:#163746}
body.theme-ocean .panel{background:#f8fdff;border-color:#9cc4d2}
body.theme-ocean .cell{background:#eefaff;border-color:#a8cfda}
body.theme-ocean .cell.plane{background:#83b7c5}
body.theme-night{background:#111827;color:#e5e7eb}
body.theme-night .panel{background:#1f2937;border-color:#374151}
body.theme-night .cell{background:#273449;border-color:#46566e;color:#f3f4f6}
body.theme-night .coord{color:#aab4c3}
body.theme-night .cell.plane{background:#4b5563}
body.theme-night .theme-picker select,body.theme-night button{background:#273449;color:#f3f4f6;border-color:#52627a}
</style>

</head>
<body>
<div class="wrap">
<h1>✈️ AVIOANE</h1>
<div class="sub">Versiunea 0.5 — lovituri și CAP clar</div>
<div class="panel">

<div class="theme-picker">
  <label>🎨 Temă:
    <select id="themeSelect">
      <option value="classic">Clasic</option>
      <option value="military">Military</option>
      <option value="ocean">Ocean</option>
      <option value="night">Noapte</option>
    </select>
  </label>
</div>

<div class="buttons">
<button id="newBtn">🔄 Joc nou</button>
<button id="showBtn">👁 Arată avioanele</button>
<button id="soundBtn">🔊 Sunet ON</button>
</div>
<div id="status" class="status">Pregătesc partida...</div>

<div class="boards">
<section>
<div class="title">TABLA TA</div>
<div id="myBoard" class="grid"></div>
</section>
<section>
<div class="title">TABLA CALCULATORULUI</div>
<div id="enemyBoard" class="grid enemy"></div>
</section>
</div>

<div class="info">Alege o căsuță pe tabla calculatorului. Pozițiile avioanelor sunt stabilite la începutul partidei și nu se schimbă.</div>
</div>
</div>

<script>
const N=10;

/* Fiecare avion are 9 celule.
   [0,0] este CAPUL. Restul sunt corp/aripi/coadă.
   Sunt permise 4 orientări. */
const SHAPES=[
 [[0,0],[1,0],[2,0],[3,0],[4,0],[1,-1],[1,1],[4,-1],[4,1]],
 [[0,0],[0,1],[0,2],[0,3],[0,4],[-1,1],[1,1],[-1,4],[1,4]],
 [[0,0],[-1,0],[-2,0],[-3,0],[-4,0],[-1,-1],[-1,1],[-4,-1],[-4,1]],
 [[0,0],[0,-1],[0,-2],[0,-3],[0,-4],[-1,-1],[1,-1],[-1,-4],[1,-4]]
];

let playerFleet=[];
let computerFleet=[];
let playerShots=new Set();
let computerShots=new Set();
let destroyedPlayer=new Set();
let destroyedComputer=new Set();
let gameOver=false;
let showPlanes=false;

let aiCandidates=[];
function resetAiSearch(){aiCandidates=[]}
function addCandidate(r,c){
  if(r<0||r>=N||c<0||c>=N)return;
  if(computerShots.has(key(r,c)))return;
  if(!aiCandidates.some(([a,b])=>a===r&&b===c))aiCandidates.push([r,c]);
}
function addNeighbours(r,c){
  addCandidate(r-1,c);addCandidate(r+1,c);addCandidate(r,c-1);addCandidate(r,c+1);
}
function chooseAiShot(){
  if(aiCandidates.length)return aiCandidates.shift();
  const choices=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!computerShots.has(key(r,c)))choices.push([r,c]);
  return choices[Math.floor(Math.random()*choices.length)];
}


const key=(r,c)=>r+","+c;

let soundEnabled=true,audioCtx=null;
async function getAudio(){
  try{
    if(!audioCtx || audioCtx.state==="closed") audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state!=="running") await audioCtx.resume();
    return audioCtx;
  }catch(e){return null}
}
async function tone(f,d,type="sine",v=.07,to=null){
  if(!soundEnabled)return;
  const c=await getAudio(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,c.currentTime);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),c.currentTime+d);
  g.gain.setValueAtTime(v,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);
}
async function noise(d=.12,v=.08){
  if(!soundEnabled)return;
  const c=await getAudio(); if(!c)return;
  const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*d)),c.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length)**2;
  const src=c.createBufferSource(),g=c.createGain();src.buffer=b;
  g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
  src.connect(g);g.connect(c.destination);src.start();
}
function sfxMiss(){tone(170,.10,"triangle",.045,100)}
function sfxHit(){noise(.10,.07);tone(95,.16,"sawtooth",.07,45)}
function sfxCap(){noise(.16,.10);tone(180,.22,"square",.06,55)}
function sfxDestroyed(){noise(.28,.14);tone(120,.38,"sawtooth",.09,35)}
function sfxWin(){tone(523,.12);setTimeout(()=>tone(659,.12),90);setTimeout(()=>tone(784,.20),180)}
function sfxLose(){tone(260,.18,"sine",.07,180);setTimeout(()=>tone(180,.30,"sine",.07,110),160)}


function placeRandomFleet(){
  const fleet=[];
  const planes=[];
  for(let p=0;p<3;p++){
    let placed=false;
    for(let attempt=0;attempt<1000 && !placed;attempt++){
      const r=Math.floor(Math.random()*N);
      const c=Math.floor(Math.random()*N);
      const d=Math.floor(Math.random()*4);
      const cells=SHAPES[d].map(([dr,dc])=>[r+dr,c+dc]);
      if(cells.some(([a,b])=>a<0||a>=N||b<0||b>=N)) continue;
      const occupied=new Set(fleet.map(([a,b])=>key(a,b)));
      if(cells.some(([a,b])=>occupied.has(key(a,b)))) continue;
      planes.push({head:[r,c],cells});
      fleet.push(...cells);
      placed=true;
    }
  }
  return {fleet,planes};
}

function coord(text){
  const e=document.createElement("div");
  e.className="coord";
  e.textContent=text;
  return e;
}

function buildBoard(id, data, shots, interactive, reveal){
  const el=document.getElementById(id);
  el.innerHTML="";
  el.appendChild(coord(""));
  for(let c=0;c<N;c++) el.appendChild(coord(String.fromCharCode(65+c)));

  for(let r=0;r<N;r++){
    el.appendChild(coord(String(r+1)));
    for(let c=0;c<N;c++){
      const cell=document.createElement("div");
      cell.className="cell";
      const k=key(r,c);
      const planeIndex=data.fleet.findIndex(([a,b])=>a===r&&b===c);
      const hasPlane=planeIndex>=0;

      if(reveal && hasPlane) cell.classList.add("plane");

      if(shots.has(k)){
        if(hasPlane){
          cell.classList.add("hit");
          const pi=data.planes.findIndex(p=>p.cells.some(([a,b])=>a===r&&b===c));
          const isHead=data.planes[pi].head[0]===r && data.planes[pi].head[1]===c;
          if(isHead) cell.classList.add("cap");
          if(destroyedFor(data,shots).has(pi)) cell.classList.add("destroyed");
        }else{
          cell.classList.add("miss");
        }
      }

      if(interactive && !shots.has(k) && !gameOver){
        cell.onclick=()=>shoot(r,c);
      }
      el.appendChild(cell);
    }
  }
}

function destroyedFor(data,shots){
  const out=new Set();
  data.planes.forEach((p,i)=>{
    if(shots.has(key(p.head[0],p.head[1]))) out.add(i);
  });
  return out;
}

function allDestroyed(data,shots){
  return destroyedFor(data,shots).size===3;
}

function setStatus(text){document.getElementById("status").textContent=text}

function draw(){
  const pd={fleet:playerFleet.fleet,planes:playerFleet.planes};
  const cd={fleet:computerFleet.fleet,planes:computerFleet.planes};
  buildBoard("myBoard",pd,computerShots,false,showPlanes);
  buildBoard("enemyBoard",cd,playerShots,true,false);
}

async function newGame(){
  if(soundEnabled) await getAudio();
  resetAiSearch();
  playerFleet=placeRandomFleet();
  computerFleet=placeRandomFleet();
  playerShots=new Set();
  computerShots=new Set();
  destroyedPlayer=new Set();
  destroyedComputer=new Set();
  gameOver=false;
  showPlanes=false;
  document.getElementById("showBtn").textContent="👁 Arată avioanele";
  setStatus("🟢 Partidă nouă! Este rândul tău. Alege o căsuță.");
  draw();
}

function shoot(r,c){
  if(gameOver)return;
  const k=key(r,c);
  if(playerShots.has(k))return;

  playerShots.add(k);
  const planeIndex=computerFleet.planes.findIndex(p=>p.cells.some(([a,b])=>a===r&&b===c));
  const hit=planeIndex>=0;
  const isHead=hit &&
    computerFleet.planes[planeIndex].head[0]===r &&
    computerFleet.planes[planeIndex].head[1]===c;

  if(isHead){
    destroyedComputer.add(planeIndex);
    if(allDestroyed(computerFleet,playerShots)){
      gameOver=true;
      sfxDestroyed();sfxWin();setStatus("🏆 AI PIERDUT! Ai distrus toate cele 3 avioane! Ai câștigat!");
      draw();
      return;
    }
    sfxCap();setStatus("☠️ CAP! Ai găsit capul avionului. Calculatorul trage...");
  }else if(hit){
    sfxHit();setStatus("💥 LOVIT! Calculatorul trage...");
  }else{
    sfxMiss();setStatus("❌ RATAT! Calculatorul trage...");
  }

  // Paint the result first, then let the browser render it before AI moves.
  requestAnimationFrame(()=>{
    draw();
    setTimeout(computerTurn,650);
  });
}

function computerTurn(){
  if(gameOver)return;
  const shot=chooseAiShot();
  if(!shot)return;
  const [r,c]=shot;
  computerShots.add(key(r,c));

  const planeIndex=playerFleet.planes.findIndex(p=>p.cells.some(([a,b])=>a===r&&b===c));
  const hit=planeIndex>=0;
  const isHead=hit&&playerFleet.planes[planeIndex].head[0]===r&&playerFleet.planes[planeIndex].head[1]===c;

  if(isHead){
    destroyedPlayer.add(planeIndex);
    sfxCap();
    resetAiSearch();
    if(allDestroyed(playerFleet,computerShots)){
      gameOver=true;
      sfxDestroyed();sfxLose();
      setStatus("☠️ Calculatorul ți-a distrus toate cele 3 avioane. Ai pierdut.");
    }else{
      setStatus("☠️ Calculatorul ți-a găsit CAPUL unui avion!");
    }
  }else if(hit){
    sfxHit();
    // După o lovitură, calculatorul încearcă imediat celulele vecine.
    addNeighbours(r,c);
    setStatus("💥 Calculatorul te-a lovit! Te urmărește...");
  }else{
    sfxMiss();
    setStatus("❌ Calculatorul a ratat. Acum e rândul tău.");
  }
  draw();
}


document.getElementById("themeSelect").addEventListener("change", e=>{
  document.body.classList.remove("theme-military","theme-ocean","theme-night");
  if(e.target.value!=="classic") document.body.classList.add("theme-"+e.target.value);
});

document.getElementById("soundBtn").onclick=async()=>{
  soundEnabled=!soundEnabled;
  document.getElementById("soundBtn").textContent=soundEnabled?"🔊 Sunet ON":"🔇 Sunet OFF";
  if(soundEnabled)await tone(660,.08,"sine",.05);
};
document.getElementById("newBtn").onclick=newGame;
document.addEventListener("touchstart",()=>{if(soundEnabled)getAudio()},{passive:true});
document.addEventListener("pointerdown",()=>{if(soundEnabled)getAudio()},{passive:true});
document.getElementById("showBtn").onclick=()=>{
  showPlanes=!showPlanes;
  document.getElementById("showBtn").textContent=showPlanes?"🙈 Ascunde avioanele":"👁 Arată avioanele";
  draw();
};

newGame();
</script>
</body>
</html>
